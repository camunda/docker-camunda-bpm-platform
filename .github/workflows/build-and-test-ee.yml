# Effective 2026-04-24, we no longer publish images to a public Docker Hub.
# EE images are published to Harbor under cambpm-ee/camunda-bpm-platform-ee.
name: Build, Test, and Publish EE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Camunda enterprise version to be tested'
      snapshot:
        description: 'Whether the version is a snapshot'
  pull_request:

jobs:
  build-and-test-ee:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.RUNNER }}
    strategy:
      matrix:
        DISTRO: [tomcat, wildfly, run]
        RUNNER: [ubuntu-22.04, aws-arm-core-4-default]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: ./pipeline.sh
        env:
          DISTRO: ${{ matrix.DISTRO }}
          EE: true
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          VERSION: ${{ github.event.inputs.version }}
          SNAPSHOT: ${{ github.event.inputs.snapshot }}
      - name: Test
        run: ./test.sh
        working-directory: test
        env:
          DISTRO: ${{ matrix.DISTRO }}
          EE: true
          VERSION: ${{ github.event.inputs.version }}
          SNAPSHOT: ${{ github.event.inputs.snapshot }}

  publish-ee:
    needs: build-and-test-ee
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.RUNNER }}
    strategy:
      matrix:
        DISTRO: [tomcat, wildfly, run]
        RUNNER: [ubuntu-22.04, aws-arm-core-4-default]
    env:
      HARBOR_IMAGE: ${{ secrets.HARBOR_REGISTRY }}/cambpm-ee/camunda-bpm-platform-ee
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep 'VERSION=' Dockerfile | head -n1 | cut -d = -f 2)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push to Harbor
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            DISTRO=${{ matrix.DISTRO }}
            EE=true
            USER=${{ secrets.NEXUS_USER }}
            PASSWORD=${{ secrets.NEXUS_PASS }}
            VERSION=${{ steps.version.outputs.VERSION }}
            SNAPSHOT=${{ github.event.inputs.snapshot }}
          tags: |
            ${{ env.HARBOR_IMAGE }}:${{ matrix.DISTRO }}-${{ steps.version.outputs.VERSION }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.DISTRO }}-image
          cache-to: type=gha,scope=${{ github.ref_name }}-${{ matrix.DISTRO }}-image

