# Effective 2026-04-24, we no longer publish images to a public Docker Hub.
name: Build and Test EE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Camunda enterprise version to be tested'
      snapshot:
        description: 'Whether the version is a snapshot'
  pull_request:

jobs:
  build-and-test-ee:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.RUNNER }}
    strategy:
      matrix:
        DISTRO: [tomcat, wildfly, run]
        RUNNER: [ubuntu-22.04, aws-arm-core-4-default]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/cambpm/ci/nexus USER | NEXUS_USER;
            secret/data/products/cambpm/ci/nexus PASSWORD | NEXUS_PASS;
            secret/data/products/cambpm/ci/harbor username | HARBOR_USERNAME;
            secret/data/products/cambpm/ci/harbor password | HARBOR_PASSWORD;
      - name: Login to Harbor
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.secrets.outputs.HARBOR_USERNAME }}
          password: ${{ steps.secrets.outputs.HARBOR_PASSWORD }}
      - name: Build
        run: ./pipeline.sh
        env:
          DISTRO: ${{ matrix.DISTRO }}
          EE: true
          NEXUS_PASS: ${{ steps.secrets.outputs.NEXUS_PASS }}
          NEXUS_USER: ${{ steps.secrets.outputs.NEXUS_USER }}
          VERSION: ${{ github.event.inputs.version }}
          SNAPSHOT: ${{ github.event.inputs.snapshot }}
          # TODO: change after testing
          PUSH_REGISTRY: ${{ github.event_name == 'workflow_dispatch' && 'registry.camunda.cloud/team-cambpm' || '' }}
      - name: Test
        run: ./test.sh
        working-directory: test
        env:
          DISTRO: ${{ matrix.DISTRO }}
          EE: true
          VERSION: ${{ github.event.inputs.version }}
          SNAPSHOT: ${{ github.event.inputs.snapshot }}

  create-manifests-ee:
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-test-ee
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        DISTRO: [tomcat, wildfly, run]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/cambpm/ci/harbor username | HARBOR_USERNAME;
            secret/data/products/cambpm/ci/harbor password | HARBOR_PASSWORD;
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.secrets.outputs.HARBOR_USERNAME }}
          password: ${{ steps.secrets.outputs.HARBOR_PASSWORD }}
      - name: Create multi-arch manifests
        run: ./create-manifests.sh
        env:
          DISTRO: ${{ matrix.DISTRO }}
          EE: true
          VERSION: ${{ github.event.inputs.version }}
          SNAPSHOT: ${{ github.event.inputs.snapshot }}
          # TODO: change after testing
          PUSH_REGISTRY: registry.camunda.cloud/team-cambpm

  # Runs whenever any of the jobs above failed, so failures don't pass by unnoticed.
  # `if: failure()` deliberately overrides the default "skip if a dependency didn't
  # succeed" behavior, so this still fires even if e.g. create-manifests-ee was
  # skipped (PR runs) while build-and-test-ee failed.
  notify-on-failure:
    if: failure()
    needs: [build-and-test-ee, create-manifests-ee]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write  # mint GitHub OIDC token for Vault JWT auth
    steps:
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/cambpm/ci/slack NOTIFY_INTERNAL_WEBHOOK | NOTIFY_INTERNAL_WEBHOOK;

      - name: Notify Slack
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ steps.secrets.outputs.NOTIFY_INTERNAL_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Build and Test EE* failed${{ github.event.inputs.version && format(' for version `{0}`', github.event.inputs.version) || '' }} on `${{ github.ref_name }}`. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }

