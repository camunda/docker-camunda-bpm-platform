# Builds the WebLogic QA Docker images (weblogic14r1, weblogic14r12) on GitHub Actions runners.
#
# This replaces the legacy Jenkins job generated by
# jenkins-job-dsl-seed-jobs/jobs/<v>/distro/platform_qa_docker.dsl.
#
# Unlike the EE/CE images (which are built from THIS repo's Dockerfile via pipeline.sh),
# the QA images are built by the `build-docker-qa` Maven profile in the platform-EE repo's
# `qa/docker` module (fabric8 docker-maven-plugin). Those sources therefore live in a
# different, private repo and are checked out here cross-repo.
#
# Native multi-arch (mirrors build-and-test-ee.yml):
#   * `build-and-test-qa` runs once per native runner (amd64 + arm64). Each runner builds
#     ONLY its native architecture (no QEMU emulation) and pushes a per-arch source tag
#     `:<version>-<arch>` to registry.camunda.cloud/team-cambpm/weblogic14r1|14r12.
#   * `create-manifests-qa` merges the per-arch tags into the final user-facing tags
#     `:<version>` (e.g. 7.24.1-ee) and `:<major>-latest` (e.g. 7.24-latest, consumed by
#     the Portainer QA stacks).
name: Build and Test QA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Camunda enterprise version to build QA images from (e.g. 7.24.1)'
        required: true
      snapshot:
        description: 'Whether the version is a snapshot. "false" -> -ee artifact, "true" -> -SNAPSHOT'
        required: false
        default: 'false'

env:
  # Repository + branch holding the qa/docker sources. For maintenance lines this is the
  # *-maintenance repo and the branch is the major version (derived from `version` below).
  # For a future non-maintenance (next) line this would be camunda/camunda-bpm-platform-ee @ next.
  EE_REPO: camunda/camunda-bpm-platform-ee-maintenance
  # Image repositories (without registry/tag) produced by the qa/docker build.
  QA_IMAGES: "registry.camunda.cloud/team-cambpm/weblogic14r1 registry.camunda.cloud/team-cambpm/weblogic14r12"

jobs:
  build-and-test-qa:
    runs-on: ${{ matrix.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        RUNNER: [ubuntu-22.04, aws-arm-core-4-default]
    steps:
      - name: Resolve architecture & EE branch
        id: ctx
        run: |
          case "$(uname -m)" in
            x86_64|amd64)  ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "ARCH=${ARCH}" >> "$GITHUB_OUTPUT"
          # 7.24.1 -> 7.24 ; 7.24.0-SNAPSHOT -> 7.24
          echo "EE_BRANCH=$(echo "${VERSION}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ github.event.inputs.version }}

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/cambpm/ci/nexus USER | NEXUS_USER;
            secret/data/products/cambpm/ci/nexus PASSWORD | NEXUS_PASS;
            secret/data/products/cambpm/ci/harbor username | HARBOR_USERNAME;
            secret/data/products/cambpm/ci/harbor password | HARBOR_PASSWORD;
            secret/data/products/cambpm/ci/github-workflow GITHUB_APP_ID | GITHUB_APP_ID;
            secret/data/products/cambpm/ci/github-workflow GITHUB_APP_PRIVATE_KEY | GITHUB_APP_PRIVATE_KEY;

      # Mint a short-lived token to check out the private qa/docker sources cross-repo.
      - name: Generate GitHub App token
        id: app-token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ steps.secrets.outputs.GITHUB_APP_ID }}
          private_key: ${{ steps.secrets.outputs.GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout qa/docker sources (platform-EE)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EE_REPO }}
          ref: ${{ steps.ctx.outputs.EE_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          path: platform-ee

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Needed to PULL the private WebLogic base images and PUSH the per-arch QA images.
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.secrets.outputs.HARBOR_USERNAME }}
          password: ${{ steps.secrets.outputs.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        run: docker buildx create --driver docker-container --bootstrap --use

      # Nexus-authenticated settings.xml (resolves org.camunda.bpm.weblogic:camunda-bpm-weblogic).
      # Maven interpolates ${env.NEXUS_USR/PSW} at runtime, so no secret is written to disk.
      - name: Generate Maven settings.xml
        run: |
          cat > "${RUNNER_TEMP}/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>camunda-nexus</id>
                <username>${env.NEXUS_USR}</username>
                <password>${env.NEXUS_PSW}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build, test & push (native ${{ steps.ctx.outputs.ARCH }})
        working-directory: platform-ee
        run: |
          set -euo pipefail
          if [ "${SNAPSHOT}" = "true" ]; then SUFFIX=SNAPSHOT; else SUFFIX=ee; fi
          SRC_TAG="${VERSION}-${SUFFIX}-${ARCH}"
          echo "Building native ${ARCH} QA images, source tag suffix: ${SRC_TAG}"
          ./mvnw -s "${RUNNER_TEMP}/settings.xml" -B -f qa/docker/pom.xml clean install \
            -Pbuild-docker-qa \
            -Dversion.camunda-bpm="${VERSION}-${SUFFIX}" \
            -Dqa.docker.platforms="linux/${ARCH}" \
            -Dqa.docker.primaryTag="${SRC_TAG}" \
            -Dqa.docker.secondaryTag="${SRC_TAG}" \
            -Ddocker.skip.push=false
        env:
          VERSION: ${{ github.event.inputs.version }}
          SNAPSHOT: ${{ github.event.inputs.snapshot }}
          ARCH: ${{ steps.ctx.outputs.ARCH }}
          NEXUS_USR: ${{ steps.secrets.outputs.NEXUS_USER }}
          NEXUS_PSW: ${{ steps.secrets.outputs.NEXUS_PASS }}

  create-manifests-qa:
    needs: build-and-test-qa
    runs-on: ubuntu-22.04
    steps:
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/cambpm/ci/harbor username | HARBOR_USERNAME;
            secret/data/products/cambpm/ci/harbor password | HARBOR_PASSWORD;

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.secrets.outputs.HARBOR_USERNAME }}
          password: ${{ steps.secrets.outputs.HARBOR_PASSWORD }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          if [ "${SNAPSHOT}" = "true" ]; then SUFFIX=SNAPSHOT; else SUFFIX=ee; fi
          VERSION_TAG="${VERSION}-${SUFFIX}"          # e.g. 7.24.1-ee
          MAJOR="$(echo "${VERSION}" | cut -d. -f1,2)"
          LATEST_TAG="${MAJOR}-latest"               # e.g. 7.24-latest (consumed by Portainer)
          for image in ${QA_IMAGES}; do
            echo "::group::Manifest ${image}:${VERSION_TAG} / :${LATEST_TAG}"
            docker buildx imagetools create \
              -t "${image}:${VERSION_TAG}" \
              -t "${image}:${LATEST_TAG}" \
              "${image}:${VERSION_TAG}-amd64" \
              "${image}:${VERSION_TAG}-arm64"
            echo "::endgroup::"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "Multi-arch manifests created:"
                echo "- ${image}:${VERSION_TAG}"
                echo "- ${image}:${LATEST_TAG}"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
        env:
          VERSION: ${{ github.event.inputs.version }}
          SNAPSHOT: ${{ github.event.inputs.snapshot }}

