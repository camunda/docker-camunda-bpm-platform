# Builds the WebLogic QA Docker images (weblogic14r1, weblogic14r12) on GitHub Actions runners.
#
# This replaces the legacy Jenkins job generated by
# jenkins-job-dsl-seed-jobs/jobs/<v>/distro/platform_qa_docker.dsl.
#
# Unlike the EE/CE images (which are built from THIS repo's Dockerfile via pipeline.sh),
# the QA images are built by the `build-docker-qa` Maven profile in the platform-EE repo's
# `qa/docker` module (fabric8 docker-maven-plugin). Those sources therefore live in a
# different, private repo and are checked out here cross-repo.
#
# amd64-only (unlike build-and-test-ee.yml, which is multi-arch):
#   Oracle WebLogic ships no ARM64 distribution, so the `team-cambpm/weblogic` base image is
#   amd64-only. A native arm64 `docker build` (no QEMU) can't exec the x86 base image and dies on
#   the first RUN instruction (`returned a non-zero code: 255`), so we build amd64 exclusively.
#   * `build-and-test-qa` builds amd64 with a classic `docker build` and pushes a per-arch source
#     tag `:<version>-amd64` to registry.camunda.cloud/team-cambpm/weblogic14r1|14r12.
#   * `create-manifests-qa` promotes that source tag to the final user-facing tags
#     `:<version>` (e.g. 7.23.1-ee) and `:<major>-latest` (e.g. 7.23-latest, consumed by
#     the Portainer QA stacks).
name: Build and Test QA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Camunda enterprise version to build QA images from (e.g. 7.23.x)'
        required: true
      snapshot:
        description: 'Whether the version is a snapshot. "false" -> -ee artifact, "true" -> -SNAPSHOT'
        required: false
        default: 'false'

env:
  # Repository + branch holding the qa/docker sources. For maintenance lines this is the
  # *-maintenance repo and the branch is the major version (derived from `version` below).
  # For a future non-maintenance (next) line this would be camunda/camunda-bpm-platform-ee @ next.
  EE_REPO: camunda/camunda-bpm-platform-ee-maintenance
  # Image repositories (without registry/tag) produced by the qa/docker build.
  QA_IMAGES: "registry.camunda.cloud/team-cambpm/weblogic14r1 registry.camunda.cloud/team-cambpm/weblogic14r12"

jobs:
  # Single source of truth: normalize the dispatch inputs ONCE so the build job and the
  # manifest job can never disagree on the artifact version or the image tag names.
  # Accepts either "7.23.1 + snapshot=true" or "7.23.1-SNAPSHOT" and produces identical outputs.
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.norm.outputs.version }}          # canonical version, no suffix (e.g. 7.23.1)
      snapshot: ${{ steps.norm.outputs.snapshot }}         # "true" | "false"
      suffix: ${{ steps.norm.outputs.suffix }}             # "SNAPSHOT" | "ee"
      version_tag: ${{ steps.norm.outputs.version_tag }}   # <version>-<suffix>   (e.g. 7.23.1-ee)
      latest_tag: ${{ steps.norm.outputs.latest_tag }}     # <major>-latest       (e.g. 7.23-latest)
      ee_branch: ${{ steps.norm.outputs.ee_branch }}       # qa/docker source branch (e.g. 7.23)
    steps:
      - name: Normalize version & snapshot
        id: norm
        run: |
          set -euo pipefail
          if [ -z "${RAW_VERSION}" ]; then
            echo "version input must not be empty" >&2; exit 1
          fi
          SNAPSHOT="${RAW_SNAPSHOT:-false}"
          # A "-SNAPSHOT" (or "-ee") suffix on the version is authoritative and implies the flag.
          case "${RAW_VERSION}" in
            *-SNAPSHOT) SNAPSHOT=true ;;
          esac
          VERSION="${RAW_VERSION%-SNAPSHOT}"
          VERSION="${VERSION%-ee}"
          if [ "${SNAPSHOT}" = "true" ]; then SUFFIX=SNAPSHOT; else SUFFIX=ee; fi
          MAJOR="$(echo "${VERSION}" | cut -d. -f1,2)"   # 7.23.1 -> 7.23
          {
            echo "version=${VERSION}"
            echo "snapshot=${SNAPSHOT}"
            echo "suffix=${SUFFIX}"
            echo "version_tag=${VERSION}-${SUFFIX}"
            echo "latest_tag=${MAJOR}-latest"
            echo "ee_branch=${MAJOR}"
          } >> "$GITHUB_OUTPUT"
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
          RAW_SNAPSHOT: ${{ github.event.inputs.snapshot }}

  build-and-test-qa:
    needs: prepare
    runs-on: ${{ matrix.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        # amd64 only: Oracle WebLogic has no ARM64 distribution, so there is no arm64 base image
        # to build on (a native arm64 build fails on the first RUN with exit code 255).
        RUNNER: [ubuntu-22.04]
    steps:
      - name: Resolve runner architecture
        id: ctx
        run: |
          case "$(uname -m)" in
            x86_64|amd64)  ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "ARCH=${ARCH}" >> "$GITHUB_OUTPUT"

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/cambpm/ci/nexus USER | NEXUS_USER;
            secret/data/products/cambpm/ci/nexus PASSWORD | NEXUS_PASS;
            secret/data/products/cambpm/ci/harbor username | HARBOR_USERNAME;
            secret/data/products/cambpm/ci/harbor password | HARBOR_PASSWORD;
            secret/data/products/cambpm/ci/github-workflow GITHUB_APP_ID | GITHUB_APP_ID;
            secret/data/products/cambpm/ci/github-workflow GITHUB_APP_PRIVATE_KEY | GITHUB_APP_PRIVATE_KEY;

      # Mint a short-lived token to check out the private qa/docker sources cross-repo.
      - name: Generate GitHub App token
        id: app-token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ steps.secrets.outputs.GITHUB_APP_ID }}
          private_key: ${{ steps.secrets.outputs.GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout qa/docker sources (platform-EE)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EE_REPO }}
          ref: ${{ needs.prepare.outputs.ee_branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: platform-ee

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Needed to PULL the private WebLogic base images and PUSH the per-arch QA images.
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.secrets.outputs.HARBOR_USERNAME }}
          password: ${{ steps.secrets.outputs.HARBOR_PASSWORD }}

      # Nexus-authenticated settings.xml (resolves org.camunda.bpm.weblogic:camunda-bpm-weblogic).
      # Maven interpolates ${env.NEXUS_USR/PSW} at runtime, so no secret is written to disk.
      #
      # The qa/docker pom declares its `camunda-nexus` repository against Artifactory
      # (artifacts.camunda.com), but the ci/nexus credentials are NOT valid there -- they belong to
      # the Camunda Nexus (repository.nexus.camunda.cloud). That is exactly what the EE Docker build
      # uses: its committed settings.xml mirrors `camunda-nexus` onto
      # repository.nexus.camunda.cloud/content/groups/internal/, whose `internal` group aggregates
      # the EE artifacts (incl. the weblogic group). We replicate that mirror here so the QA build
      # resolves against the host the credentials actually authenticate against (otherwise -> 401).
      # mirrorOf is scoped to `camunda-nexus`, so Maven Central is left untouched, and the mirror
      # shares the server id so the credentials above apply.
      - name: Generate Maven settings.xml
        run: |
          cat > "${RUNNER_TEMP}/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>camunda-nexus</id>
                <username>${env.NEXUS_USR}</username>
                <password>${env.NEXUS_PSW}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>camunda-nexus</id>
                <mirrorOf>camunda-nexus</mirrorOf>
                <name>Camunda Nexus</name>
                <url>https://repository.nexus.camunda.cloud/content/groups/internal/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build, test & push (native ${{ steps.ctx.outputs.ARCH }})
        working-directory: platform-ee
        run: |
          set -euo pipefail
          SRC_TAG="${VERSION_TAG}-${ARCH}"   # e.g. 7.23.1-ee-amd64
          echo "Building native ${ARCH} QA images, source tag: ${SRC_TAG}"
          ./mvnw -s "${RUNNER_TEMP}/settings.xml" -B -f qa/docker/pom.xml clean install \
            -Pbuild-docker-qa \
            -Dversion.camunda-bpm="${VERSION_TAG}" \
            -Dqa.docker.primaryTag="${SRC_TAG}" \
            -Dqa.docker.secondaryTag="${SRC_TAG}" \
            -Ddocker.skip.push=false
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          ARCH: ${{ steps.ctx.outputs.ARCH }}
          NEXUS_USR: ${{ steps.secrets.outputs.NEXUS_USER }}
          NEXUS_PSW: ${{ steps.secrets.outputs.NEXUS_PASS }}

  create-manifests-qa:
    needs: [prepare, build-and-test-qa]
    runs-on: ubuntu-22.04
    steps:
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/cambpm/ci/harbor username | HARBOR_USERNAME;
            secret/data/products/cambpm/ci/harbor password | HARBOR_PASSWORD;

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.secrets.outputs.HARBOR_USERNAME }}
          password: ${{ steps.secrets.outputs.HARBOR_PASSWORD }}

      - name: Create final tags
        run: |
          set -euo pipefail
          # VERSION_TAG / LATEST_TAG come from the shared `prepare` job, so they are guaranteed
          # to match the per-arch source tag pushed by build-and-test-qa.
          # amd64-only (WebLogic has no arm64 build), so we promote the single amd64 source tag
          # to the final user-facing tags rather than merging a multi-arch manifest.
          for image in ${QA_IMAGES}; do
            echo "::group::Tag ${image}:${VERSION_TAG} / :${LATEST_TAG}"
            docker buildx imagetools create \
              -t "${image}:${VERSION_TAG}" \
              -t "${image}:${LATEST_TAG}" \
              "${image}:${VERSION_TAG}-amd64"
            echo "::endgroup::"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "Final tags created (amd64-only):"
                echo "- ${image}:${VERSION_TAG}"
                echo "- ${image}:${LATEST_TAG}"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          LATEST_TAG: ${{ needs.prepare.outputs.latest_tag }}

  # Runs whenever any of the jobs above failed, so failures don't pass by unnoticed.
  # `if: failure()` deliberately overrides the default "skip if a dependency didn't
  # succeed" behavior, so this still fires even if e.g. `prepare` failed and the
  # remaining jobs were consequently skipped rather than failed themselves.
  notify-on-failure:
    if: failure()
    needs: [prepare, build-and-test-qa, create-manifests-qa]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write  # mint GitHub OIDC token for Vault JWT auth
    steps:
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/cambpm/ci/slack NOTIFY_INTERNAL_WEBHOOK | NOTIFY_INTERNAL_WEBHOOK;
      - name: Notify Slack
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ steps.secrets.outputs.NOTIFY_INTERNAL_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Build and Test QA* failed for version `${{ github.event.inputs.version }}` on `${{ github.ref_name }}`. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }
